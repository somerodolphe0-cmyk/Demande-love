<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pour Toi ❤️</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,400&family=Poppins:wght@300;400;500&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            background: radial-gradient(circle at center, #ff758c 0%, #ff7eb3 40%, #d81b60 100%);
            font-family: 'Poppins', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            position: relative;
            user-select: none;
        }

        /* Arrière-plan animé de cœurs flottants */
        .hearts-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
        }

        .heart {
            position: absolute;
            bottom: -50px;
            color: rgba(255, 255, 255, 0.35);
            font-size: 24px;
            animation: floatUp linear infinite;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(0.8) rotate(0deg);
                opacity: 0;
            }
            20% {
                opacity: 0.8;
            }
            80% {
                opacity: 0.6;
            }
            100% {
                transform: translateY(-110vh) scale(1.3) rotate(360deg);
                opacity: 0;
            }
        }

        /* Écran d'accueil avant le clic */
        .welcome-screen {
            z-index: 2;
            text-align: center;
            color: #ffffff;
            padding: 20px;
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        .welcome-screen h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.5rem, 6vw, 4.5rem);
            font-weight: 700;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        .welcome-screen p {
            font-size: 1.1rem;
            font-weight: 300;
            opacity: 0.9;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.85; }
            50% { transform: scale(1.05); opacity: 1; }
        }

        /* Superposition sombre lors de l'ouverture de la modale */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            cursor: default;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* Boîte de message en noir */
        .black-box {
            background-color: #0b0b0d;
            color: #ffffff;
            width: 90%;
            max-width: 480px;
            padding: 45px 35px;
            border-radius: 20px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.1);
            text-align: center;
            position: relative;
            transform: scale(0.85) translateY(20px);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-overlay.active .black-box {
            transform: scale(1) translateY(0);
        }

        .close-btn {
            position: absolute;
            top: 16px;
            right: 20px;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.5);
            font-size: 24px;
            cursor: pointer;
            transition: color 0.2s;
        }

        .close-btn:hover {
            color: #ffffff;
        }

        .black-box h2 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(1.9rem, 4vw, 2.5rem);
            font-weight: 500;
            margin-bottom: 28px;
            line-height: 1.25;
            color: #ffffff;
        }

        /* Formulaire */
        .love-form {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .love-form textarea {
            width: 100%;
            min-height: 110px;
            padding: 15px 18px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background-color: #ffffff;
            color: #111111;
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
            resize: none;
            outline: none;
            transition: box-shadow 0.3s ease;
        }

        .love-form textarea:focus {
            box-shadow: 0 0 0 3px rgba(255, 117, 140, 0.6);
        }

        .submit-btn {
            align-self: center;
            padding: 12px 34px;
            border-radius: 50px;
            border: 1px solid rgba(255, 117, 140, 0.6);
            background: linear-gradient(135deg, #ff4b72 0%, #d81b60 100%);
            color: #ffffff;
            font-family: 'Poppins', sans-serif;
            font-size: 0.95rem;
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(216, 27, 96, 0.5);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .status-message {
            margin-top: 15px;
            font-size: 0.95rem;
            color: #ff8fa3;
            min-height: 22px;
        }
    </style>
</head>
<body id="mainBody">

    <!-- Cœurs flottants en arrière-plan -->
    <div class="hearts-container" id="heartsContainer"></div>

    <!-- Texte d'accueil -->
    <div class="welcome-screen" id="welcomeScreen">
        <h1>Celebrate Love ❤️</h1>
        <p>Clique n'importe où sur l'écran...</p>
    </div>

    <!-- Fenêtre modale noire -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="black-box" id="blackBox">
            <button class="close-btn" id="closeBtn" aria-label="Fermer">&times;</button>
            <h2>dis moi ce que tu veux</h2>
            
            <form class="love-form" id="loveForm" action="https://formspree.io/f/xoedjdpy" method="POST">
                <textarea 
                    name="message" 
                    id="wishInput" 
                    placeholder="Exprime tes désirs..." 
                    required
                ></textarea>
                <button type="submit" class="submit-btn" id="submitBtn">Envoyer &rarr;</button>
            </form>

            <div class="status-message" id="statusMessage"></div>
        </div>
    </div>

    <script>
        // 1. Génération des cœurs flottants
        const heartsContainer = document.getElementById('heartsContainer');
        const heartSymbols = ['❤️', '💖', '💕', '🌹', '✨'];

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerText = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.fontSize = (Math.random() * 20 + 14) + 'px';
            const duration = Math.random() * 5 + 6;
            heart.style.animationDuration = duration + 's';
            
            heartsContainer.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, duration * 1000);
        }

        setInterval(createHeart, 400);

        // 2. Ouverture du message noir au moindre clic sur la page
        const mainBody = document.getElementById('mainBody');
        const modalOverlay = document.getElementById('modalOverlay');
        const closeBtn = document.getElementById('closeBtn');
        const wishInput = document.getElementById('wishInput');

        mainBody.addEventListener('click', (e) => {
            if (!modalOverlay.classList.contains('active')) {
                modalOverlay.classList.add('active');
                setTimeout(() => wishInput.focus(), 300);
            }
        });

        // Empêcher la fermeture quand on clique à l'intérieur de la boîte noire
        document.getElementById('blackBox').addEventListener('click', (e) => {
            e.stopPropagation();
        });

        // Bouton fermer
        closeBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            modalOverlay.classList.remove('active');
        });

        // 3. Envoi silencieux vers ton adresse mail via Formspree
        const loveForm = document.getElementById('loveForm');
        const statusMessage = document.getElementById('statusMessage');
        const submitBtn = document.getElementById('submitBtn');

        loveForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            submitBtn.disabled = true;
            submitBtn.innerText = "Envoi en cours...";
            statusMessage.innerText = "";

            const formData = new FormData(loveForm);

            try {
                const response = await fetch(loveForm.action, {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'Accept': 'application/json'
                    }
                });

                if (response.ok) {
                    statusMessage.innerText = "Message envoyé avec amour ❤️ Je m'en occupe...";
                    loveForm.reset();
                    submitBtn.innerText = "Envoyé ✓";
                } else {
                    statusMessage.innerText = "Oups, une erreur s'est produite. Réessaie.";
                    submitBtn.disabled = false;
                    submitBtn.innerText = "Envoyer →";
                }
            } catch (error) {
                statusMessage.innerText = "Problème de connexion. Vérifie ton réseau.";
                submitBtn.disabled = false;
                submitBtn.innerText = "Envoyer →";
            }
        });
    </script>
</body>
</html>
